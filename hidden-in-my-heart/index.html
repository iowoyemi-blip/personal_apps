<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a2e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hidden">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Hidden in My Heart</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Scripture Memory</p>
        <h1>Hidden in My Heart</h1>
      </div>
      <div class="top-actions">
        <button class="icon-button" type="button" data-action="open-backup" aria-label="Backup">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
        </button>
        <button class="icon-button primary-icon" type="button" data-action="new-verse" aria-label="Add verse">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
      </div>
    </header>

    <section class="stats" aria-label="Collection summary">
      <div>
        <span id="verseCount">0</span>
        <small>Verses</small>
      </div>
      <div>
        <span id="categoryCount">0</span>
        <small>Categories</small>
      </div>
      <div>
        <span id="journalCount">0</span>
        <small>Journal</small>
      </div>
    </section>

    <section id="view" class="view"></section>

    <nav class="tabbar" aria-label="App sections">
      <button type="button" data-route="library" class="tab active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h11a3 3 0 0 1 3 3v14.5a1.5 1.5 0 0 0-1.5-1.5H6a2 2 0 0 0-2 2"></path><path d="M8 7h7"></path></svg>
        Library
      </button>
      <button type="button" data-route="practice" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15 21 21"></path><path d="M4 4l5 5"></path></svg>
        Practice
      </button>
      <button type="button" data-route="categories" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"></path><circle cx="7.5" cy="7.5" r=".5"></circle></svg>
        Categories
      </button>
      <button type="button" data-route="backup" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10 12 15 17 10"></path><path d="M12 15V3"></path></svg>
        Backup
      </button>
    </nav>
  </main>

  <dialog id="verseDialog">
    <form id="verseForm" class="dialog-shell" method="dialog">
      <header class="dialog-head">
        <button class="plain-button" type="button" data-action="close-verse">Cancel</button>
        <h2 id="verseDialogTitle">Add a Verse</h2>
        <button class="save-button" type="submit">Save</button>
      </header>
      <div class="dialog-body">
        <label>Reference
          <input id="referenceInput" class="field" type="text" autocomplete="off" placeholder="John 3:16" required>
        </label>
        <label>Verse Text
          <textarea id="textInput" class="field" rows="6" required></textarea>
        </label>
        <label>Translation
          <input id="translationInput" class="field" type="text" autocomplete="off" placeholder="KJV">
        </label>
        <label>New Journal Entry
          <textarea id="journalInput" class="field" rows="4" placeholder="Optional note from study, prayer, or reflection"></textarea>
        </label>
        <fieldset>
          <legend>Categories</legend>
          <div id="categoryChecks" class="check-grid"></div>
          <input id="newCategoryInput" class="field" type="text" autocomplete="off" placeholder="...or type a new category">
        </fieldset>
        <p id="verseError" class="error"></p>
      </div>
    </form>
  </dialog>

  <dialog id="journalDialog">
    <form id="journalForm" class="dialog-shell" method="dialog">
      <header class="dialog-head">
        <button class="plain-button" type="button" data-action="close-journal">Close</button>
        <h2 id="journalTitle">Journal</h2>
        <span aria-hidden="true"></span>
      </header>
      <div class="dialog-body">
        <p id="journalVerseText" class="verse-context"></p>
        <label>Add Entry
          <textarea id="journalNewInput" class="field" rows="4" placeholder="Write a new journal note"></textarea>
        </label>
        <button class="primary wide" type="button" data-action="add-journal">Save Entry</button>
        <div id="journalEntries" class="entry-stack"></div>
      </div>
    </form>
  </dialog>

  <dialog id="categoryDialog">
    <form id="categoryForm" class="dialog-shell" method="dialog">
      <header class="dialog-head">
        <button class="plain-button" type="button" data-action="close-category">Cancel</button>
        <h2>Rename Category</h2>
        <button class="save-button" type="submit">Save</button>
      </header>
      <div class="dialog-body">
        <label>Category Name
          <input id="categoryNameInput" class="field" type="text" autocomplete="off" required>
        </label>
        <p id="categoryError" class="error"></p>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
